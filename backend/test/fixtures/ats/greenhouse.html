<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Senior Backend Engineer — Acme Pay</title></head>
<body>
  <h1>Senior Backend Engineer</h1>
  <form id="application_form" action="/submit" method="post" enctype="multipart/form-data">
    <label for="first_name">First Name <span aria-hidden="true">*</span></label>
    <input type="text" id="first_name" name="job_application[first_name]" required>

    <label for="last_name">Last Name *</label>
    <input type="text" id="last_name" name="job_application[last_name]" required>

    <label for="email">Email *</label>
    <input type="email" id="email" name="job_application[email]" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]">

    <label for="resume">Resume/CV *</label>
    <input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx" required>

    <label for="linkedin">LinkedIn Profile</label>
    <input type="text" id="linkedin" name="job_application[urls][LinkedIn]">

    <label for="auth">Are you legally authorized to work in India? *</label>
    <select id="auth" name="job_application[answers_attributes][0]" required>
      <option value="">Please select</option>
      <option value="1">Yes</option>
      <option value="0">No</option>
    </select>

    <label for="why">Why do you want to work here?</label>
    <textarea id="why" name="job_application[answers_attributes][1]" rows="5"></textarea>

    <label for="notice">Notice period</label>
    <input type="text" id="notice" name="job_application[answers_attributes][2]">

    <input type="submit" id="submit_app" value="Submit Application">
  </form>
</body>
</html>
