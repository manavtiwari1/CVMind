<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Platform Engineer — Acme Pay</title></head>
<body>
  <h2>Submit your application</h2>
  <form action="/submit" method="POST" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="Full name" required aria-label="Full name">
    <input type="email" name="email" placeholder="Email" required aria-label="Email">
    <input type="tel" name="phone" placeholder="Phone" aria-label="Phone">
    <input type="text" name="org" placeholder="Current company" aria-label="Current company">
    <input type="text" name="urls[LinkedIn]" placeholder="LinkedIn URL" aria-label="LinkedIn URL">
    <input type="text" name="urls[GitHub]" placeholder="GitHub URL" aria-label="GitHub URL">

    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="resume" accept=".pdf" required>

    <fieldset>
      <legend>Will you now or in the future require visa sponsorship?</legend>
      <label><input type="radio" name="cards[sponsorship]" value="Yes"> Yes</label>
      <label><input type="radio" name="cards[sponsorship]" value="No"> No</label>
    </fieldset>

    <button type="submit" class="postings-btn">Submit application</button>
  </form>
</body>
</html>
