<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVMind AI Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <div class="brand-sparkle">✨</div>
        <div class="brand-text">
          <span class="brand-title">CVMind AI</span>
          <span class="brand-subtitle">Auto Apply Copilot</span>
        </div>
      </div>
      <div class="status-badge" id="conn-badge">Checking…</div>
    </header>

    <!-- Not connected: pair with a code from the CVMind web app -->
    <section class="profile-card" id="pair-section" hidden>
      <div class="profile-details">
        <div class="profile-name">Connect this browser</div>
        <div class="profile-role">In CVMind, open Job Preferences and create a connection code.</div>
        <input class="pair-input" id="pair-code" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false">
        <button class="primary-btn" id="btn-pair"><span>Connect</span></button>
        <div class="pair-error" id="pair-error" hidden></div>
      </div>
    </section>

    <!-- Connected -->
    <section class="profile-card" id="connected-section" hidden>
      <div class="profile-avatar" id="user-avatar">CV</div>
      <div class="profile-details">
        <div class="profile-name" id="device-name">This browser</div>
        <div class="profile-role" id="account-email">Connected to CVMind</div>
      </div>
      <button class="link-btn" id="btn-unpair" title="Disconnect this browser">Disconnect</button>
    </section>

    <section class="tab-status-card" id="page-section" hidden>
      <div class="tab-status-header">
        <span class="section-label">This page</span>
        <span class="detect-pill" id="page-detect-status">Checking…</span>
      </div>
      <div class="job-meta">
        <div class="job-title-display" id="tab-job-title">—</div>
        <div class="job-match-badge" id="tab-job-match" hidden></div>
      </div>
    </section>

    <section class="action-section" id="action-section" hidden>
      <button class="primary-btn" id="btn-popup-autofill"><span>⚡ Fill this application</span></button>
      <button class="secondary-btn" id="btn-popup-track"><span>＋ Add this job to CVMind</span></button>
      <div class="pair-error" id="action-error" hidden></div>
    </section>

    <details class="advanced">
      <summary>Advanced</summary>
      <label class="advanced-label" for="api-base">CVMind server</label>
      <input class="pair-input" id="api-base" spellcheck="false" autocomplete="off">
      <button class="secondary-btn" id="btn-save-api"><span>Save server</span></button>
    </details>

    <footer class="popup-footer">
      <a href="https://www.cvmind.online/auto-apply" target="_blank" rel="noopener" class="footer-btn">Open CVMind dashboard ↗</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
